<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Light ON OFF</title>

    <style>

        body {
            min-height: 100vh;
            margin: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #0f2027,
                #203a43,
                #2c5364
            );
        }

        /* Main Card */
        .light-card {
            width: 420px;
            padding: 40px 30px;

            text-align: center;

            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(15px);

            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        /* Heading */
        .light-card h1 {
            color: white;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .light-card p {
            color: #d0d0d0;
            margin-bottom: 30px;
        }

        /* Bulb Area */
        .bulb-container {
            width: 180px;
            height: 180px;

            margin: 0 auto 30px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;

            transition: 0.4s;
        }

        .bulb-container:hover {
            transform: scale(1.05);
        }

        /* Bulb */
        #myImage {
            width: 110px;

            transition: 0.4s;

            filter: drop-shadow(
                0 0 10px rgba(255, 255, 255, 0.3)
            );
        }

        /* Buttons */
        .light-btn {
            width: 150px;
            padding: 12px;

            border: none;
            border-radius: 30px;

            font-size: 16px;
            font-weight: bold;

            transition: 0.3s;
        }

        .on-btn {
            background: #ffc107;
            color: #212529;
        }

        .off-btn {
            background: #dc3545;
            color: white;
        }

        .light-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .light-btn:active {
            transform: scale(0.95);
        }

        /* Status */
        #status {
            color: white;
            font-size: 18px;
            font-weight: bold;

            margin-top: 25px;
        }

    </style>
</head>

<body>

    <div class="light-card">

        <h1>💡 Light Control</h1>

        <p>Turn your light ON or OFF</p>


        <!-- Bulb -->
        <div class="bulb-container">

            <img
                id="myImage"
                src="./pic_bulboff.gif"
                alt="Light Bulb"
            >

        </div>


        <!-- Buttons -->
        <div class="d-flex justify-content-center gap-3">

            <button
                class="light-btn on-btn"
                onclick="turnOn()">
                💡 Turn ON
            </button>

            <button
                class="light-btn off-btn"
                onclick="turnOff()">
                🌙 Turn OFF
            </button>

        </div>


        <!-- Status -->
        <div id="status">
            Light is OFF
        </div>

    </div>


    <script>

        function turnOn() {

            document.getElementById("myImage").src =
                "./pic_bulbon.gif";

            document.getElementById("status").innerHTML =
                "💡 Light is ON";

        }


        function turnOff() {

            document.getElementById("myImage").src =
                "./pic_bulboff.gif";

            document.getElementById("status").innerHTML =
                "🌙 Light is OFF";

        }

    </script>

</body>

</html>
