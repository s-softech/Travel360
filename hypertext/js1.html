<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram UI</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body{
            background: #000;
            color: white;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Top Navbar */
        .top-nav{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            font-size: 28px;
            position: sticky;
            top: 0;
            background: black;
            z-index: 100;
        }

        .logo{
            font-size: 30px;
            font-weight: bold;
        }

        /* Stories */
        .stories{
            display: flex;
            overflow-x: auto;
            padding: 10px;
            gap: 15px;
        }

        .stories::-webkit-scrollbar{
            display: none;
        }

        .story{
            text-align: center;
            min-width: 80px;
        }

        .story img{
            width: 75px;
            height: 75px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(
                45deg,
                orange,
                red,
                purple,
                pink
            );
        }

        .story p{
            font-size: 12px;
            margin-top: 5px;
        }

        /* Post */
        .post-header{
            display: flex;
            align-items: center;
            padding: 10px;
        }

        .post-header img{
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 10px;
        }

        .post-img{
            width: 100%;
            height: 450px;
            object-fit: cover;
        }

        .post-icons{
            padding: 10px;
            font-size: 24px;
            display: flex;
            gap: 20px;
        }

        /* Bottom Nav */
        .bottom-nav{
            position: fixed;
            bottom: 0;
            width: 100%;
            background: black;
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            border-top: 1px solid #333;
        }

        .bottom-nav i{
            color: white;
            font-size: 25px;
        }
    </style>
</head>
<body>

    <!-- Top Navbar -->
    <div class="top-nav">
        <i class="bi bi-plus-lg"></i>
        <div class="logo">Instagram</div>
        <div>
            <i class="bi bi-heart"></i>
            <i class="bi bi-chat ms-3"></i>
        </div>
    </div>

    <!-- Stories -->
    <div class="stories">

        <div class="story">
            <img src="https://picsum.photos/100?1">
            <p>Your Story</p>
        </div>

        <div class="story">
            <img src="https://picsum.photos/100?2">
            <p>raju</p>
        </div>

        <div class="story">
            <img src="https://picsum.photos/100?3">
            <p>shaik</p>
        </div>

        <div class="story">
            <img src="https://picsum.photos/100?4">
            <p>duke</p>
        </div>

    </div>

    <!-- Post -->
    <div class="post">

        <div class="post-header">
            <img src="https://picsum.photos/100?5">
            <div>
                <b>code.abhii07</b><br>
                <small>Original Audio</small>
            </div>
        </div>

        <img src="https://picsum.photos/500/500" class="post-img">

        <div class="post-icons">
            <i class="bi bi-heart"></i>
            <i class="bi bi-chat"></i>
            <i class="bi bi-send"></i>
            <i class="bi bi-bookmark ms-auto"></i>
        </div>

    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <i class="bi bi-house-fill"></i>
        <i class="bi bi-search"></i>
        <i class="bi bi-plus-square"></i>
        <i class="bi bi-film"></i>
        <i class="bi bi-person-circle"></i>
    </div>

</body>
</html>
